<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style></head>
<body><canvas id="gl"></canvas><canvas id="out"></canvas>
<script id="fs" type="x-shader">#version 300 es
precision highp float;
uniform sampler2D C,D;uniform vec2 R;uniform float AR,zoom,dz,rot,heat,blur,ca,T,flash,red;uniform vec2 par,pan;uniform float GR;
out vec4 o;
float h(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
vec2 toImg(vec2 v){return vec2(.5+(v.x-.5)*AR,v.y);}
vec2 cam(vec2 q,float s){ // q: centrado; s: escala extra (blur)
 q*=s;q.x*=.5625;float c=cos(rot),sn=sin(rot);q=mat2(c,-sn,sn,c)*q;q.x/=.5625;
 vec2 b=q/zoom+.5+pan;float d=texture(D,toImg(b)).r;
 for(int k=0;k<2;k++){b=q/(zoom*(1.+dz*(d-.5)))+.5+pan+par*(d-.45);d=texture(D,toImg(b)).r;}
 if(heat>0.){b+=heat*vec2(n2(b*vec2(14.,30.)+vec2(0.,T*2.5))-.5,n2(b*vec2(30.,14.)-vec2(T*2.,0.))-.5)*.008*(1.2-d);}
 return toImg(b);}
vec3 tap(vec2 q,float s){
 if(ca>0.){return vec3(texture(C,cam(q,s*(1.+ca))).r,texture(C,cam(q,s)).g,texture(C,cam(q,s*(1.-ca))).b);}
 return texture(C,cam(q,s)).rgb;}
void main(){vec2 uv=gl_FragCoord.xy/R;vec2 q=uv-.5;
 vec3 c;
 if(blur>0.){c=vec3(0);for(int i=0;i<10;i++){c+=tap(q,1.-float(i)*blur*.012);}c/=10.;}else c=tap(q,1.);
 // gradación
 c=pow(c,vec3(1.05));c=c*c*(3.-2.*c)*.35+c*.65;float l=dot(c,vec3(.299,.587,.114));c=mix(vec3(l),c,1.18);
 c*=1.-.55*pow(length((uv-.5)*vec2(1.,1.25)),2.2);
 c+=(h(gl_FragCoord.xy+fract(T*7.)*91.)-.5)*GR;
 c=mix(c,vec3(1.,.25,.1)*l*1.6,red);c+=flash;
 o=vec4(c,1);}
</script>
<script>
const W=1080,H=1920;let RS=1,GS=.75; // W,H: coordenadas de maquetación; RS: escala de salida (2 = 4K)
const gl=document.getElementById('gl'),out=document.getElementById('out');
function resize(){gl.width=Math.round(W*RS*GS);gl.height=Math.round(H*RS*GS);out.width=W*RS;out.height=H*RS;}resize();
const g=gl.getContext('webgl2',{preserveDrawingBuffer:true});
const sh=(t,s)=>{const x=g.createShader(t);g.shaderSource(x,s);g.compileShader(x);if(!g.getShaderParameter(x,g.COMPILE_STATUS))throw g.getShaderInfoLog(x);return x;};
const pr=g.createProgram();g.attachShader(pr,sh(g.VERTEX_SHADER,`#version 300 es
in vec2 a;void main(){gl_Position=vec4(a,0,1);}`));g.attachShader(pr,sh(g.FRAGMENT_SHADER,document.getElementById('fs').textContent));
g.linkProgram(pr);g.useProgram(pr);
const bb=g.createBuffer();g.bindBuffer(g.ARRAY_BUFFER,bb);g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),g.STATIC_DRAW);
const al=g.getAttribLocation(pr,'a');g.enableVertexAttribArray(al);g.vertexAttribPointer(al,2,g.FLOAT,false,0,0);
const U=n=>g.getUniformLocation(pr,n);g.uniform1i(U('C'),0);g.uniform1i(U('D'),1);
const ctx=out.getContext('2d');
let TEX={},TL;
function mk(im){const t=g.createTexture();g.bindTexture(g.TEXTURE_2D,t);g.pixelStorei(g.UNPACK_FLIP_Y_WEBGL,true);
 g.texImage2D(g.TEXTURE_2D,0,g.RGBA,g.RGBA,g.UNSIGNED_BYTE,im);g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MIN_FILTER,g.LINEAR);
 g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MAG_FILTER,g.LINEAR);g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_S,g.CLAMP_TO_EDGE);g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_T,g.CLAMP_TO_EDGE);return t;}
const load=u=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=u;});
window.addTex=async(k,c,d)=>{TEX[k]={c:mk(await load(c)),d:mk(await load(d))};return k;};
window.setup=async(tl,imgs)=>{TL=tl;if(tl.res){RS=tl.res;GS=tl.gs??1;resize();}for(const k in imgs){TEX[k]={c:mk(await load(imgs[k].c)),d:mk(await load(imgs[k].d))};}
 await document.fonts.load('900 50px "Inter Display"');return Object.keys(TEX).length;};
// ---------- cámara ----------
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
const eo=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);
const MOV={ // z0,z1, par x0,y0 -> x1,y1, pan x0,y0->x1,y1, rot0,rot1, dz
 push:[1.06,1.22,[0,0],[0,.02],[0,0],[0,0],0,0,.25],
 pull:[1.28,1.07,[0,.02],[0,0],[0,0],[0,0],0,0,.25],
 orbitL:[1.12,1.18,[-.035,0],[.035,0],[0,0],[0,0],-.01,.01,.15],
 orbitR:[1.12,1.18,[.035,0],[-.035,0],[0,0],[0,0],.01,-.01,.15],
 crane:[1.1,1.16,[0,-.035],[0,.03],[0,.02],[0,-.02],0,0,.15],
 rush:[1.05,1.45,[0,0],[0,.03],[0,0],[0,0],0,.02,.45],
 drift:[1.15,1.2,[-.02,.01],[.02,-.01],[-.02,0],[.02,0],0,0,.1],
 spin:[1.2,1.3,[0,0],[0,0],[0,0],[0,0],-.08,.08,.1],
};
const SH={ // movimiento, partículas, calor
 a02_1:['crane','dust',0],a01_10:['push','dust',0],a03_20:['rush','embers',1],a04_100:['orbitL','embers',1],a05_30:['push','embers',1],
 a06_40:['orbitR','none',0],a07_51:['crane','ash',.6],a08_201:['drift','acid',.3],a09_61:['spin','none',0],a10_71:['push','dust',.8],
 a11_301:['pull','ash',.4],a12_80:['crane','bubbles',0],a13_400:['orbitL','none',0],a14_90:['push','sparks',.5],a15_501:['crane','dust',.5],
 a16_111:['orbitR','ash',.7],a17_120:['rush','sparks',1],a18_130:['pull','none',0],a19_140:['push','embers',.6]};
function shake(time){let s=0;for(const t of TL.impacts){const d=time-t;if(d>=0&&d<.6)s=Math.max(s,(1-d/.6)**2);}return s;}
function flashAt(time){let f=0;for(const t of TL.flashes){const d=time-t;if(d>=0&&d<.35)f=Math.max(f,(1-d/.35)**2*.55);}return f;}
// ---------- partículas ----------
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function parts(kind,t,seed){if(kind==='none')return;ctx.save();ctx.globalCompositeOperation='lighter';
 const N={embers:70,ash:60,dust:45,acid:50,bubbles:40,sparks:45}[kind];
 for(let i=0;i<N;i++){const r=k=>rnd(seed*97+i*13+k);const z=.4+r(1)*1.2;let x,y,s,col,a;
  if(kind==='embers'||kind==='sparks'){const v=(kind==='sparks'?520:170)*z;y=(r(2)*H*1.2-t*v)%(H*1.2);if(y<0)y+=H*1.2;y=H*1.1-y;
   x=r(3)*W+Math.sin(t*(1+r(4))+r(5)*6)*40*z;s=(kind==='sparks'?2.5:3.5)*z;a=.5+.5*Math.sin(t*6+r(6)*9);col=r(7)>.5?'255,140,40':'255,200,90';}
  else if(kind==='bubbles'){y=(r(2)*H-t*90*z)%H;if(y<0)y+=H;y=H-y;x=r(3)*W+Math.sin(t*2+r(4)*6)*20;s=3*z;a=.35;col='180,220,255';}
  else{const v=(kind==='ash'?-60:25)*z;y=(r(2)*H+t*(-v)+H*4)%H;x=(r(3)*W+t*(kind==='acid'?60:20)*z+W*4)%W;s=(kind==='dust'?2:3)*z;a=.35*(.6+.4*Math.sin(t*2+r(6)*9));
   col=kind==='acid'?'230,230,90':kind==='ash'?'200,170,150':'255,230,200';}
  const gr=ctx.createRadialGradient(x,y,0,x,y,s*4);gr.addColorStop(0,`rgba(${col},${a})`);gr.addColorStop(1,`rgba(${col},0)`);
  ctx.fillStyle=gr;ctx.fillRect(x-s*4,y-s*4,s*8,s*8);
  if(kind==='sparks'){ctx.strokeStyle=`rgba(${col},${a*.6})`;ctx.lineWidth=s*.8;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+s*10);ctx.stroke();}}
 ctx.restore();}
// ---------- texto ----------
const F='"Inter Display", Inter, sans-serif';
function txt(s,x,y,size,o={}){const a=o.a??1;if(a<=0)return;ctx.save();ctx.globalAlpha=Math.min(1,a);ctx.translate(x,y);const sc=o.s??1;ctx.scale(sc,sc);
 ctx.font=`${o.w||900} ${size}px ${F}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
 const mw=ctx.measureText(s).width*sc;if(mw>W-70){const k=(W-70)/mw;ctx.scale(k,k);}
 if(o.glow){ctx.shadowColor=o.glow;ctx.shadowBlur=size*.6;ctx.fillStyle=o.color||'#fff';ctx.fillText(s,0,0);ctx.shadowBlur=0;}
 ctx.lineWidth=size*.17;ctx.strokeStyle='rgba(0,0,0,.92)';ctx.strokeText(s,0,0);ctx.fillStyle=o.color||'#fff';ctx.fillText(s,0,0);ctx.restore();}
const pop=d=>{if(d<0)return 0;if(d>.35)return 1;const x=d/.35;return 1+Math.sin(x*Math.PI)*.35*(1-x)+(x<.25?-(1-x/.25)*.7:0);};
function callouts(time){for(const c of TL.calls){if(time<c.a||time>c.b)continue;const d=time-c.a,fo=Math.min(1,(c.b-time)/.2);
 let s=c.text;if(c.count){const k=eo((time-c.a)/c.count[1]);s=c.text.replace('#',Math.round(c.count[0]*k).toLocaleString('es-ES'));}
 txt(s,W/2,c.y,c.size,{a:Math.min(1,d/.08)*fo,s:pop(d),color:c.color,glow:c.glow});}}
function captions(time){const w=TL.words;let i=w.findIndex(x=>time>=x.a&&time<x.b+.15);if(i<0)return;const pg=w[i].page;
 const ws=w.filter(x=>x.page===pg);ctx.save();ctx.font=`900 84px ${F}`;const sp=22;
 const widths=ws.map(x=>ctx.measureText(x.s).width);let tot=widths.reduce((a,b)=>a+b,0)+sp*(ws.length-1);
 let x=W/2-tot/2;const y=1390;
 ws.forEach((x0,j)=>{const cur=time>=x0.a&&time<x0.b+.15&&x0===w[i];const said=time>=x0.a;
  const sc=cur?1+.18*Math.max(0,1-(time-x0.a)/.15):1;
  txt(x0.s,x+widths[j]/2,y,84,{s:sc,color:cur?'#ffd23f':said?'#ffffff':'rgba(255,255,255,.75)',a:said?1:.85});x+=widths[j]+sp;});ctx.restore();}
// ---------- mapas (globo con países reales; d3-geo y GEO los inyecta render.js) ----------
let GEO=null;window.setGeo=x=>{GEO=x;GEO.grat=d3.geoGraticule10();};
function rutaPts(r){const o=[];for(let k=0;k<r.length-1;k++){const f=d3.geoInterpolate(r[k],r[k+1]);for(let j=0;j<64;j++)o.push(f(j/64));}o.push(r[r.length-1]);return o;}
function mapa(time){const m=(TL.maps||[]).find(x=>time>=x.a&&time<x.b);if(!m||!GEO)return;
 const al=Math.min(1,(time-m.a)/.35,(m.b-time)/.3),u=(time-m.a)/(m.b-m.a),K=m.vuela;let c;
 if(K.length===1)c=[K[0][0]+(time-m.a)*4,K[0][1],K[0][2]]; // un solo punto: el globo gira despacio
 else{const n=K.length-1,sg=Math.min(n-1,Math.floor(u*n)),v=ease(u*n-sg),A=K[sg],B=K[sg+1];
  const ll=d3.geoInterpolate([A[0],A[1]],[B[0],B[1]])(v);c=[ll[0],ll[1],A[2]*Math.pow(B[2]/A[2],v)];}
 const R=W*.42*c[2],cx=W/2,cy=H*.45;
 const pj=d3.geoOrthographic().scale(R).translate([cx,cy]).rotate([-c[0],-c[1]]).clipAngle(90).precision(.3),path=d3.geoPath(pj,ctx);
 ctx.save();ctx.globalAlpha=al;ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
 const at=ctx.createRadialGradient(cx,cy,R*.96,cx,cy,R*1.16);at.addColorStop(0,'rgba(90,175,255,.55)');at.addColorStop(1,'rgba(90,175,255,0)');
 ctx.fillStyle=at;ctx.beginPath();ctx.arc(cx,cy,R*1.16,0,7);ctx.fill(); // atmósfera
 const oc=ctx.createRadialGradient(cx-R*.35,cy-R*.35,R*.1,cx,cy,R);oc.addColorStop(0,'#14406a');oc.addColorStop(1,'#030c18');
 ctx.beginPath();path({type:'Sphere'});ctx.fillStyle=oc;ctx.fill();
 ctx.beginPath();path(GEO.grat);ctx.strokeStyle='rgba(159,224,255,.1)';ctx.lineWidth=1;ctx.stroke();
 ctx.beginPath();path(GEO.land);ctx.fillStyle='#34503d';ctx.fill();
 ctx.save();ctx.shadowColor='rgba(120,200,255,.9)';ctx.shadowBlur=8;ctx.strokeStyle='rgba(170,225,255,.85)';ctx.lineWidth=1.6;ctx.stroke();ctx.restore();
 ctx.beginPath();path(GEO.borders);ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=.9;ctx.stroke();
 ctx.save();ctx.beginPath();path({type:'Sphere'});ctx.clip(); // luz lateral: volumen de esfera
 const sh=ctx.createRadialGradient(cx-R*.4,cy-R*.45,R*.15,cx,cy,R*1.05);sh.addColorStop(0,'rgba(255,255,255,.1)');sh.addColorStop(.55,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,0,0,.6)');
 ctx.fillStyle=sh;ctx.fillRect(0,0,W,H);ctx.restore();
 const vis=p=>d3.geoDistance(p,[c[0],c[1]])<Math.PI/2-.03;
 if(m.ruta&&m.ruta.length>1&&time>m.ra){const P=m._p||(m._p=rutaPts(m.ruta)),k=eo((time-m.ra)/(m.rb-m.ra)),n=Math.max(2,Math.round(k*(P.length-1))+1),S=P.slice(0,n);
  ctx.save();ctx.beginPath();path({type:'LineString',coordinates:S});ctx.lineCap='round';
  ctx.shadowColor='rgba(255,120,30,.9)';ctx.shadowBlur=18;ctx.strokeStyle='#ffd23f';ctx.lineWidth=7;ctx.stroke();ctx.restore();
  const hd=S[S.length-1];if(k<1&&vis(hd)){const q=pj(hd);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(q[0],q[1],10,0,7);ctx.fill();}}
 for(const k of m.marcas){if(time<k.a||!vis(k.en))continue;const q=pj(k.en),d=time-k.a,ph=(d*1.1)%1;
  ctx.strokeStyle=`rgba(255,210,63,${1-ph})`;ctx.lineWidth=4;ctx.beginPath();ctx.arc(q[0],q[1],12+ph*46,0,7);ctx.stroke();
  ctx.save();ctx.shadowColor='rgba(255,120,30,1)';ctx.shadowBlur=20;ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(q[0],q[1],11,0,7);ctx.fill();ctx.restore();
  if(k.texto&&q[1]>330)txt(k.texto,Math.min(W-230,Math.max(230,q[0])),q[1]-70,54,{a:al*Math.min(1,d/.12),s:pop(d),color:'#ffffff',glow:'rgba(255,120,30,.8)'});}
 ctx.restore();}
// ---------- fotograma ----------
window.frame=time=>{ctx.setTransform(RS,0,0,RS,0,0);
 const S=TL.shots;let i=S.findIndex(s=>time>=s.a&&time<s.b);if(i<0)i=S.length-1;const s=S[i];const L=s.b-s.a,t=time-s.a,u=t/L;
 const [mv,pk,heat]=SH[s.k];const m=MOV[mv];const e=ease(u)*.7+u*.3;
 const tin=Math.max(0,1-t/.28),tout=Math.max(0,1-(s.b-time)/.14)*(i<S.length-1?1:0);
 const sk=shake(time);
 const zoom=(m[0]+(m[1]-m[0])*e)*(1+.18*eo(tin)*(1)+.12*tout*tout);
 const L2=(a,b)=>[a[0]+(b[0]-a[0])*e,a[1]+(b[1]-a[1])*e];
 const par=L2(m[2],m[3]),pan=L2(m[4],m[5]);
 pan[0]+=sk*.012*Math.sin(time*73);pan[1]+=sk*.012*Math.cos(time*61);
 g.viewport(0,0,gl.width,gl.height);g.activeTexture(g.TEXTURE0);g.bindTexture(g.TEXTURE_2D,TEX[s.k].c);g.activeTexture(g.TEXTURE1);g.bindTexture(g.TEXTURE_2D,TEX[s.k].d);
 g.uniform2f(U('R'),gl.width,gl.height);g.uniform1f(U('GR'),RS>1?.022:.045);g.uniform1f(U('AR'),(W/H)/(832/1216));g.uniform1f(U('zoom'),zoom);g.uniform1f(U('dz'),m[8]);
 g.uniform1f(U('rot'),m[6]+(m[7]-m[6])*e+sk*.01*Math.sin(time*50));g.uniform2f(U('par'),par[0],par[1]);g.uniform2f(U('pan'),pan[0],pan[1]);
 g.uniform1f(U('heat'),heat);g.uniform1f(U('blur'),Math.max(tin*tin*1.6,tout*1.4,sk*.5));g.uniform1f(U('ca'),Math.max(tin,tout,sk)*.012);
 g.uniform1f(U('T'),time);g.uniform1f(U('flash'),flashAt(time)+tin*tin*.12);g.uniform1f(U('red'),TL.red.some(r=>time>=r[0]&&time<r[1])?.35:0);
 g.drawArrays(g.TRIANGLES,0,3);
 ctx.drawImage(gl,0,0,W,H);
 parts(pk,time,i+1);
 mapa(time);
 // barra de progreso arriba
 ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(0,0,W,8);ctx.fillStyle='#ffd23f';ctx.fillRect(0,0,W*time/TL.total,8);
 callouts(time);captions(time);
 return out.toDataURL('image/jpeg',RS>1?.93:.9);};
</script></body></html>
